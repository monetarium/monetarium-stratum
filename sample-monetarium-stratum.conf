; monetarium-stratum example configuration file.
;
; All options can also be passed as command line flags:
;   monetarium-stratum --blocksubmitdivisor=2

; Host:port of the monetarium-node RPC server.
noderpc=127.0.0.1:9509

; Node RPC credentials (must match the node's rpcuser/rpcpass).
rpcuser=changeme
rpcpass=changeme

; Path to the node's RPC TLS certificate.  Leave empty to disable TLS (not
; recommended; the node generates rpc.cert in its data directory by default).
rpccert=/home/user/.monetarium/rpc.cert

; Address to listen for miner connections.
listen=0.0.0.0:5550

; Pool share difficulty.  Lower values accept shares more often.
sharedifficulty=100

; Self-limiting block submission: only 1 in every N solved blocks is submitted
; to the network; the remaining N-1 are discarded.  Set to 1 (the default) to
; submit every solved block.  Use this when your mining hardware would
; otherwise find more than 51% of the network's blocks.
;
; Example: with blocksubmitdivisor=2 your effective submitted hashrate is
; halved; with 10 it is reduced to a tenth.
blocksubmitdivisor=1

; When set, workers must authorize with this password.  When empty (default),
; any worker name is accepted.
;poolpassword=secret

; Maximum number of simultaneously connected miners.
maxclients=10

; Logging level: trace, debug, info, warn, error, critical.
debuglevel=info
