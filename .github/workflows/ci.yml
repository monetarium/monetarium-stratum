name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Fake CUDA/NVRTC tests (C harness + Go integration)
        run: make -C cmd/gpuminer test-cuda

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...